<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brho's Food Blog</title>
    <meta
      name="description"
      content="Small and cute food blog for me to share my food experiences with my friends :3"
    />
    <meta name="keywords" content="food, cooking, recipes, blog" />
    <meta name="author" content="Brho" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="Temmie.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Runs before Angular loads: sets data-theme immediately to avoid a flash. -->
    <script>
      (function () {
        var key = 'food-blog-theme';
        var theme = localStorage.getItem(key);
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
