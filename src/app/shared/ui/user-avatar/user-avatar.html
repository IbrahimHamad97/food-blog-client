@if (showPhoto()) {
  <img
    class="user-avatar user-avatar--photo"
    [class.user-avatar--xs]="size() === 'xs'"
    [class.user-avatar--sm]="size() === 'sm'"
    [class.user-avatar--lg]="size() === 'lg'"
    [src]="avatarUrl()!"
    [alt]="name() + ' avatar'"
    referrerpolicy="no-referrer"
    (error)="onImageError()"
  />
} @else {
  <span
    class="user-avatar user-avatar--initials"
    [class.user-avatar--xs]="size() === 'xs'"
    [class.user-avatar--sm]="size() === 'sm'"
    [class.user-avatar--lg]="size() === 'lg'"
    role="img"
    [attr.aria-label]="name()"
  >
    {{ initials() }}
  </span>
}
