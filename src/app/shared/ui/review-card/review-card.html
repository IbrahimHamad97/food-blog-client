<a
  class="review-card"
  [class.review-card--carousel]="layout() === 'carousel'"
  [class.review-card--placeholder]="usingPlaceholder()"
  [routerLink]="['/reviews', review().id]"
>
  <app-review-bookmark-button
    class="review-card__bookmark"
    [reviewId]="review().id"
    [authorId]="review().author.id"
    [bookmarkedByMe]="review().bookmarkedByMe ?? false"
    [compact]="true"
  />
  <div
    class="review-card__media"
    [class.review-card__media--placeholder]="usingPlaceholder()"
  >
    <img
      class="review-card__image"
      [class.review-card__image--placeholder]="usingPlaceholder()"
      [src]="coverImage()"
      [alt]="
        usingPlaceholder()
          ? 'No photo for this review'
          : 'Photo for ' + review().placeName
      "
      loading="lazy"
      width="400"
      height="260"
    />
  </div>
  <div class="review-card__body">
    <div class="review-card__meta">
      <app-rating-stars [rating]="review().rating" />
      <time class="review-card__date" [dateTime]="review().publishedAt">
        {{ review().publishedAt | date: 'mediumDate' }}
      </time>
    </div>
    <h3 class="review-card__title">{{ review().title }}</h3>
    <p class="review-card__place">{{ review().placeName }}</p>
    <p class="review-card__meta-line">{{ serviceLabel() }}</p>
    @if (shownTags().length) {
      <div class="review-card__tags" aria-label="Tags">
        @for (tag of shownTags(); track tag) {
          <span class="review-card__tag">{{ tag }}</span>
        }
        @if (moreTagCount() > 0) {
          <span class="review-card__tag review-card__tag--more">+{{ moreTagCount() }}</span>
        }
      </div>
    }
    <p class="review-card__excerpt">{{ review().body }}</p>
    <div class="review-card__actions">
      <app-review-like-button
        [reviewId]="review().id"
        [authorId]="review().author.id"
        [likeCount]="review().likeCount"
        [likedByMe]="review().likedByMe ?? false"
        [compact]="true"
      />
    </div>
    <button
      type="button"
      class="review-card__author"
      [attr.aria-label]="'View profile for ' + review().author.name"
      (click)="goToAuthor($event)"
    >
      <app-user-avatar
        [name]="review().author.name"
        [avatarUrl]="review().author.avatarUrl"
        size="xs"
      />
      <span>{{ review().author.name }}</span>
    </button>
  </div>
</a>
